[project]
name = "structured-agents"
version = "0.3.0"
description = "Durable primitives for constrained-agent workflows."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" }]
dependencies = [
  "pydantic>=2.13.3",
  "pydantic-ai-slim[openai]>=2.11,<3",
  "dbos>=2.23",
  "httpx>=0.28",
  "numpy>=2",
  "transformers>=4.38,<5",
  "xgrammar==0.2.1",
  # Step-7 refactor (003-reference-consumer-refactor): the shared llama.cpp
  # teaching core is consumed from inferference (one library, one ABI, one
  # test suite) instead of the ported-in llama_core copy. The ABI-anchor pair
  # (llama-cpp-python 0.3.34 binding + the integration libllama) must stay
  # exactly the unit inferference pins: the Mode A wheel
  # (ci/modea/wheels/llama_cpp_python-0.3.34-*.whl, built 97ad953ef) or a Mode B
  # LLAMA_CPP_LIB_PATH pointing at the same tree. The CUDA-LoRA-NaN fix
  # (24c5d3dbc) is NOT in the 81a5dba8… wheel — see 02-REPORT.md §wheel gap.
  "inferference==0.1.0",
  "llama-cpp-python==0.3.34",
]

[tool.uv.sources]
# Dev wiring: path dependency on the sibling inferference checkout (the flat
# package src/inferference). Release: install the built inferference wheel.
inferference = { path = "../inferference" }
# ABI-anchor pair: the binding must come from the Mode A wheel (b10233, anchor
# 0ab9d6fed) — NEVER a PyPI cp313 wheel or a source build (stock llama.cpp).
# (Path source pinned to the wheel file; uv rejects file:// URLs in url sources.)
llama-cpp-python = { path = "/home/andrew/Documents/Projects/inferference/ci/modea/wheels/llama_cpp_python-0.3.34-py3-none-linux_x86_64.whl" }

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ty>=0.0.46",
  "ruff>=0.11",
]
fornix = []

[project.urls]
homepage = "https://github.com/Bullish-Design/structured-agents-v2"
repository = "https://github.com/Bullish-Design/structured-agents-v2.git"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structured_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["live: hits the configured inference server (skipped unless SAV_LIVE=1)."]

[tool.ty.environment]
python-version = "3.13"

[[tool.ty.overrides]]
include = ["src/structured_agents/engine/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["src/structured_agents/constraint.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["src/structured_agents/agent.py"]

[tool.ty.overrides.rules]
no-matching-overload = "ignore"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
